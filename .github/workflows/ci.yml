name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# This repository builds and tests on its own: a C99 compiler and make, no
# dependency, and nothing outside the checkout. The generated codec tree
# (examples/demo/src/generated) is committed for exactly this reason - a job
# here can never reach a sibling repository, and no job installs a generator
# to check that tree for freshness either.
jobs:
  linux:
    name: linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: build and test
        run: make test CC=${{ matrix.cc }}

      # Every test again under AddressSanitizer and UndefinedBehaviorSanitizer.
      # LeakSanitizer rides along with ASan on Linux, which is what makes this
      # worth a second run: the library mallocs its outbox, receive buffer and
      # event arena, the UDP hub queues datagrams, and the generated decoder
      # mallocs strings - this is what proves they are all released.
      - name: sanitizers
        run: make sanitize CC=${{ matrix.cc }}

      - name: examples build
        run: make examples CC=${{ matrix.cc }}

  macos:
    name: macos (clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: make test
      - name: sanitizers
        run: make sanitize

  # The Winsock half of src/transport/socket.c is the one part of this library
  # that a POSIX developer cannot exercise locally, so it gets its own job
  # rather than being taken on trust.
  windows:
    name: windows (mingw)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake

      - name: build and test
        run: make test

      # Windows is the only place the exported ws2_32 requirement can be
      # checked, which is why this job runs the package test too.
      - name: package
        run: ./scripts/package-test.sh

  # The Makefile stays the canonical build - it compiles the library, runs
  # every test and the sanitizer pass. CMake exists only so a consuming
  # project can find_package(fomoxa) and link fomoxa::fomoxa, so what this
  # job checks is exactly that: configure, build, install to a throwaway
  # prefix, then configure tests/package against the installed result and run
  # what it produced. Nothing here duplicates a test list.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: cmake install and consume
        run: ./scripts/package-test.sh
